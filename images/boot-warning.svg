<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="t d">
  <title id="t">Warning: do not drive or tamper with the boot</title>
  <desc id="d">Do not drive with the boot attached. Do not tamper with, break, or remove the boot without a release code. Damage or tampering may result in repair or replacement charges, collections, and legal action. Return the boot within 24 hours of release.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1d23"/>
      <stop offset="1" stop-color="#0d0e11"/>
    </linearGradient>
    <linearGradient id="yel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="1" stop-color="#e6a800"/>
    </linearGradient>
    <pattern id="stripes" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="20" height="40" fill="#f5b400"/>
      <rect x="20" width="20" height="40" fill="#16181d"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="22" fill="url(#stripes)"/>
  <rect y="778" width="1200" height="22" fill="url(#stripes)"/>

  <!-- Heading -->
  <g transform="translate(60 70)">
    <path d="M45 0 L90 80 H0 Z" fill="#e5322d"/>
    <rect x="40" y="22" width="10" height="34" rx="4" fill="#fff"/>
    <circle cx="45" cy="66" r="6" fill="#fff"/>
  </g>
  <text x="170" y="110" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="60" fill="#e5322d">WARNING</text>
  <text x="60" y="200" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="46" fill="#fff">DO NOT DRIVE OR</text>
  <text x="60" y="255" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="46" fill="#fff">TAMPER WITH THE BOOT</text>
  <rect x="60" y="280" width="560" height="5" fill="#f5b400"/>

  <!-- Rule 1: no driving -->
  <g transform="translate(60 315)">
    <circle cx="40" cy="40" r="36" fill="none" stroke="#e5322d" stroke-width="7"/>
    <g fill="#fff">
      <rect x="18" y="36" width="44" height="16" rx="5"/>
      <path d="M26 36 L32 24 H50 L56 36 Z"/>
      <circle cx="28" cy="54" r="6"/><circle cx="52" cy="54" r="6"/>
    </g>
    <line x1="15" y1="15" x2="65" y2="65" stroke="#e5322d" stroke-width="7"/>
    <text x="100" y="32" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="26" fill="#fff">Never drive with the boot attached.</text>
    <text x="100" y="64" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#c9ccd3">Moving the vehicle can damage your tires, wheels,</text>
    <text x="100" y="88" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#c9ccd3">suspension, and the boot.</text>
  </g>

  <!-- Rule 2: no tampering -->
  <g transform="translate(60 440)">
    <circle cx="40" cy="40" r="36" fill="none" stroke="#e5322d" stroke-width="7"/>
    <g stroke="#fff" stroke-width="7" stroke-linecap="round" fill="none">
      <line x1="24" y1="56" x2="50" y2="30"/>
      <path d="M50 30 a10 10 0 1 1 6 -14"/>
      <line x1="30" y1="26" x2="56" y2="54"/>
    </g>
    <line x1="15" y1="15" x2="65" y2="65" stroke="#e5322d" stroke-width="7"/>
    <text x="100" y="32" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="26" fill="#fff">Do not cut, pry, break, or remove the boot.</text>
    <text x="100" y="64" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#c9ccd3">Only remove it with the release code you paid for.</text>
    <text x="100" y="88" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#c9ccd3">You will be charged for repair or replacement.</text>
  </g>

  <!-- Rule 3: legal -->
  <g transform="translate(60 565)">
    <circle cx="40" cy="40" r="36" fill="none" stroke="#e5322d" stroke-width="7"/>
    <g fill="#fff">
      <rect x="22" y="22" width="30" height="14" rx="3" transform="rotate(-35 37 29)"/>
      <rect x="36" y="34" width="6" height="26" rx="2" transform="rotate(-35 39 47)"/>
      <rect x="20" y="58" width="40" height="7" rx="2"/>
    </g>
    <text x="100" y="32" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="26" fill="#fff">Tampering or theft may be prosecuted.</text>
    <text x="100" y="64" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#c9ccd3">Damage, loss, or unreturned boots may result in</text>
    <text x="100" y="88" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#c9ccd3">fees, collections, and legal action.</text>
  </g>

  <!-- Rule 4: return -->
  <g transform="translate(60 690)">
    <circle cx="40" cy="30" r="30" fill="#f5b400"/>
    <circle cx="40" cy="30" r="20" fill="none" stroke="#16181d" stroke-width="5"/>
    <path d="M40 18 V30 L49 36" stroke="#16181d" stroke-width="5" fill="none" stroke-linecap="round"/>
    <text x="100" y="40" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="26" fill="#f5b400">Return the boot within 24 hours of release.</text>
  </g>

  <!-- Wheel with boot illustration -->
  <g transform="translate(940 380)">
    <circle r="190" fill="#0a0a0c"/>
    <circle r="182" fill="#202228"/>
    <circle r="150" fill="#16171b"/>
    <circle r="112" fill="#8d939e"/>
    <circle r="100" fill="#b7bcc5"/>
    <g fill="#5b6270">
      <path d="M-14 -96 H14 L8 -26 H-8 Z"/>
      <path d="M-14 -96 H14 L8 -26 H-8 Z" transform="rotate(72)"/>
      <path d="M-14 -96 H14 L8 -26 H-8 Z" transform="rotate(144)"/>
      <path d="M-14 -96 H14 L8 -26 H-8 Z" transform="rotate(216)"/>
      <path d="M-14 -96 H14 L8 -26 H-8 Z" transform="rotate(288)"/>
    </g>
    <circle r="30" fill="#3a3e47"/>
    <circle r="12" fill="#b7bcc5"/>
    <!-- boot -->
    <g>
      <path d="M-70 -40 H70 V40 Q70 60 50 60 H-50 Q-70 60 -70 40 Z" fill="url(#yel)" stroke="#8a6400" stroke-width="4"/>
      <circle cx="0" cy="10" r="22" fill="#2b2b2b"/>
      <circle cx="0" cy="10" r="10" fill="#f5b400"/>
      <path d="M-30 -40 V-120 Q-30 -150 0 -150 Q30 -150 30 -120 V-40" fill="none" stroke="#c9ccd3" stroke-width="14"/>
      <path d="M40 60 L120 150 L90 172 L10 75 Z" fill="url(#yel)" stroke="#8a6400" stroke-width="4"/>
      <rect x="70" y="150" width="90" height="26" rx="6" fill="url(#yel)" stroke="#8a6400" stroke-width="4" transform="rotate(10 115 163)"/>
          </g>
    <!-- prohibition sign -->
    <circle r="215" fill="none" stroke="#e5322d" stroke-width="22" opacity=".92"/>
    <line x1="-152" y1="-152" x2="152" y2="152" stroke="#e5322d" stroke-width="22" opacity=".92"/>
  </g>

  <text x="940" y="680" text-anchor="middle" font-family="Arial Black, Arial, Helvetica, sans-serif" font-weight="900" font-size="34" fill="#fff" letter-spacing="6">JLS <tspan fill="#f5b400">BOOTS</tspan></text>
  <text x="940" y="712" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#c9ccd3" letter-spacing="2">PAY ONLINE AT JLSBOOTS.COM</text>
</svg>
